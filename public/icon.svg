<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="4" />
  
  <!-- Inner Safe Zone 4-panel Grid (representing MULTIVIEW) -->
  <g transform="translate(80, 80)">
    <!-- Top-Left Screen (Active with cyan gradient) -->
    <rect x="0" y="0" width="166" height="166" rx="20" fill="#191b20" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8" />
    <!-- Play Icon in panel 1 -->
    <path d="M68 60 L112 83 L68 106 Z" fill="url(#cyanGrad)" filter="url(#glow)" />
    
    <!-- Top-Right Screen (Active with emerald gradient) -->
    <rect x="186" y="0" width="166" height="166" rx="20" fill="#191b20" stroke="#34d399" stroke-width="3" stroke-opacity="0.8" />
    <!-- Audio Wave lines in panel 2 -->
    <line x1="240" y1="70" x2="240" y2="96" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    <line x1="256" y1="56" x2="256" y2="110" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    <line x1="272" y1="76" x2="272" y2="90" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    <line x1="288" y1="62" x2="288" y2="104" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    <line x1="304" y1="72" x2="304" y2="94" stroke="#34d399" stroke-width="6" stroke-linecap="round" />

    <!-- Bottom-Left Screen -->
    <rect x="0" y="186" width="166" height="166" rx="20" fill="#191b20" stroke="#374151" stroke-width="2.5" />
    <!-- Signal broadcast dot -->
    <circle cx="83" cy="269" r="14" fill="#6366f1" />
    <circle cx="83" cy="269" r="28" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="4 4" />
    <circle cx="83" cy="269" r="42" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="6 6" />

    <!-- Bottom-Right Screen -->
    <rect x="186" y="186" width="166" height="166" rx="20" fill="#191b20" stroke="#374151" stroke-width="2.5" />
    <!-- 4 mini sub-grids in panel 4 -->
    <rect x="226" y="226" width="36" height="36" rx="6" fill="#10b981" fill-opacity="0.7" />
    <rect x="270" y="226" width="36" height="36" rx="6" fill="#06b6d4" fill-opacity="0.7" />
    <rect x="226" y="270" width="36" height="36" rx="6" fill="#8b5cf6" fill-opacity="0.7" />
    <rect x="270" y="270" width="36" height="36" rx="6" fill="#f59e0b" fill-opacity="0.7" />
  </g>
</svg>
